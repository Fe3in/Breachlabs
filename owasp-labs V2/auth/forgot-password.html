<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reset password — BREACHLAB</title>
<link rel="stylesheet" href="../css/style.css" />
</head>
<body data-base="../">

<nav class="nav"><div id="nav-root"></div></nav>

<div class="auth-wrap">
  <div class="auth-card">
    <h1>Reset your password</h1>
    <p class="sub">We'll email you a link to set a new one.</p>

    <div class="form-msg" id="msg"></div>

    <form id="forgot-form">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="email" />
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Send reset link</button>
    </form>

    <p class="auth-foot">
      <a href="signin.html">Back to sign in</a>
    </p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js"></script>
<script src="../js/supabase-client.js"></script>
<script src="../js/auth.js"></script>
<script>
  renderNav('forgot');

  const form = document.getElementById('forgot-form');
  const msg = document.getElementById('msg');
  const btn = document.getElementById('submit-btn');

  function showMsg(text, type) {
    msg.textContent = text;
    msg.className = `form-msg show ${type}`;
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    btn.disabled = true;
    btn.textContent = 'Sending...';

    const email = document.getElementById('email').value.trim();
    const redirectTo = window.location.origin + window.location.pathname.replace('forgot-password.html', 'reset-password.html');

    const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo });

    btn.disabled = false;
    btn.textContent = 'Send reset link';

    if (error) {
      showMsg(error.message, 'error');
      return;
    }
    showMsg('If that email has an account, a reset link is on its way.', 'ok');
    form.reset();
  });
</script>
</body>
</html>
