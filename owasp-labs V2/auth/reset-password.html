<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Set new password — BREACHLAB</title>
<link rel="stylesheet" href="../css/style.css" />
</head>
<body data-base="../">

<nav class="nav"><div id="nav-root"></div></nav>

<div class="auth-wrap">
  <div class="auth-card">
    <h1>Set a new password</h1>
    <p class="sub">This link works once — choose a new password below.</p>

    <div class="form-msg" id="msg"></div>

    <form id="reset-form">
      <div class="field">
        <label for="password">New password</label>
        <input type="password" id="password" required minlength="6" autocomplete="new-password" />
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Update password</button>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js"></script>
<script src="../js/supabase-client.js"></script>
<script src="../js/auth.js"></script>
<script>
  renderNav('reset');

  const form = document.getElementById('reset-form');
  const msg = document.getElementById('msg');
  const btn = document.getElementById('submit-btn');

  function showMsg(text, type) {
    msg.textContent = text;
    msg.className = `form-msg show ${type}`;
  }

  // Supabase reads the recovery token from the URL fragment automatically
  // (detectSessionInUrl: true in supabase-client.js) and opens a session.

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    btn.disabled = true;
    btn.textContent = 'Updating...';

    const password = document.getElementById('password').value;
    const { error } = await sb.auth.updateUser({ password });

    btn.disabled = false;
    btn.textContent = 'Update password';

    if (error) {
      showMsg(error.message, 'error');
      return;
    }
    showMsg('Password updated. Redirecting to sign in...', 'ok');
    setTimeout(() => (window.location.href = 'signin.html'), 1500);
  });
</script>
</body>
</html>
